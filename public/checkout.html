<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement Sécurisé</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#0066FF',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::selection { background: #2563eb; color: #fff; }
    .method-card.selected {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.08);
    }
  </style>
</head>
<body class="bg-[#0c0e14] text-slate-200 min-h-screen flex items-center justify-center p-4 font-sans antialiased">

  <div class="max-w-md w-full bg-[#121620] border border-white/[0.08] rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 relative overflow-hidden">

    <!-- Loading Overlay -->
    <div id="checkout-loading" class="absolute inset-0 bg-[#121620]/90 backdrop-blur-sm z-30 flex flex-col items-center justify-center space-y-3">
      <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs text-slate-400 font-medium">Chargement de la commande...</p>
    </div>

    <!-- HEADER / COMMERÇANT -->
    <div class="flex items-center justify-between border-b border-white/[0.06] pb-5">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-base uppercase" id="merchant-avatar">
          P
        </div>
        <div>
          <h2 class="font-bold text-sm text-white" id="merchant-name">Paiement</h2>
          <p class="text-xs text-slate-400" id="order-desc">Commande</p>
        </div>
      </div>
      <div class="text-right">
        <span class="text-xs text-slate-400 block">Total à payer</span>
        <span class="text-lg font-bold text-white font-mono" id="order-amount">0 XOF</span>
      </div>
    </div>

    <!-- ERROR BANNER -->
    <div id="checkout-error" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 p-3 rounded-xl text-xs flex items-center gap-2">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
      <span id="error-message">Une erreur est survenue</span>
    </div>

    <!-- CHOIX DU MODE DE PAIEMENT -->
    <div class="space-y-3">
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">
        Choisir un moyen de paiement
      </label>

      <div class="grid grid-cols-1 gap-2.5" id="methods-container">
        
        <!-- Mobile Money (LomoPay) -->
        <label class="method-card selected border border-white/[0.08] bg-[#0c0e14] hover:border-blue-500/50 p-3.5 rounded-2xl cursor-pointer flex items-center justify-between transition" onclick="selectMethod('lomopay')">
          <div class="flex items-center gap-3">
            <input type="radio" name="payment_method" value="lomopay" checked class="text-blue-600 focus:ring-0">
            <div>
              <span class="font-medium text-xs text-white block">Mobile Money</span>
              <span class="text-[11px] text-slate-400">Wave, Orange Money, MTN MoMo, Moov, Djamo</span>
            </div>
          </div>
          <div class="flex items-center gap-1.5 opacity-80">
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-orange-500/20 text-orange-400 font-bold">XOF</span>
          </div>
        </label>

        <!-- Carte Bancaire (Whop / Stripe) -->
        <label class="method-card border border-white/[0.08] bg-[#0c0e14] hover:border-blue-500/50 p-3.5 rounded-2xl cursor-pointer flex items-center justify-between transition" onclick="selectMethod('whop')">
          <div class="flex items-center gap-3">
            <input type="radio" name="payment_method" value="whop" class="text-blue-600 focus:ring-0">
            <div>
              <span class="font-medium text-xs text-white block">Carte Bancaire / Apple Pay</span>
              <span class="text-[11px] text-slate-400">Visa, Mastercard, Google Pay</span>
            </div>
          </div>
          <div class="flex items-center gap-1 opacity-70">
            <i data-lucide="credit-card" class="w-4 h-4 text-slate-300"></i>
          </div>
        </label>

      </div>
    </div>

    <!-- COORDONNÉES CLIENT -->
    <div class="space-y-3 pt-1 text-xs">
      <div>
        <label class="block text-slate-400 mb-1">Email pour le reçu</label>
        <input type="email" id="cust-email" required placeholder="nom@example.com" class="w-full bg-[#0c0e14] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-blue-500" />
      </div>
      <div>
        <label class="block text-slate-400 mb-1">Nom complet (facultatif)</label>
        <input type="text" id="cust-name" placeholder="Jean Dupont" class="w-full bg-[#0c0e14] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-blue-500" />
      </div>
    </div>

    <!-- BOUTON PAYER -->
    <div class="pt-2">
      <button onclick="submitPayment()" id="btn-pay" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl text-xs font-semibold flex items-center justify-center gap-2 shadow-lg shadow-blue-600/25 transition">
        <i data-lucide="lock" class="w-4 h-4"></i>
        <span id="btn-pay-text">Procéder au paiement</span>
      </button>
    </div>

    <!-- FOOTER SÉCURITÉ -->
    <div class="flex items-center justify-center gap-1.5 text-[11px] text-slate-500 pt-2 border-t border-white/[0.04]">
      <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i>
      <span>Paiement chiffré et sécurisé SSL 256-bit</span>
    </div>

  </div>

  <script>
    let sessionData = null;
    let selectedProvider = 'lomopay';

    const sessionId = window.location.pathname.split('/').filter(Boolean).pop();

    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      await fetchSession();
    });

    async function fetchSession() {
      try {
        const res = await fetch(`/api/v1/payments/checkout/${sessionId}`);
        const data = await res.json();

        if (!data.success || !data.session) {
          showError("Cette session de paiement n'existe pas ou a expiré.");
          return;
        }

        sessionData = data.session;
        renderCheckout(sessionData, data.gateways);
      } catch (err) {
        showError("Impossible de charger les détails du paiement.");
      } finally {
        document.getElementById("checkout-loading").classList.add("hidden");
      }
    }

    function renderCheckout(session, gateways) {
      document.getElementById("merchant-name").innerText = session.appName || "Paiement Sécurisé";
      document.getElementById("merchant-avatar").innerText = (session.appName || "P")[0].toUpperCase();
      document.getElementById("order-desc").innerText = session.description || `Commande #${session.orderId}`;
      
      const formattedAmount = Number(session.amount).toLocaleString('fr-FR');
      document.getElementById("order-amount").innerText = `${formattedAmount} ${session.currency}`;
      document.getElementById("btn-pay-text").innerText = `Payer ${formattedAmount} ${session.currency}`;

      if (session.customer?.email) {
        document.getElementById("cust-email").value = session.customer.email;
      }
      if (session.customer?.name) {
        document.getElementById("cust-name").value = session.customer.name;
      }

      if (session.preferredProvider && session.preferredProvider !== 'auto') {
        selectMethod(session.preferredProvider);
      }
    }

    function selectMethod(method) {
      selectedProvider = method;
      document.querySelectorAll('.method-card').forEach(card => {
        const radio = card.querySelector('input[type="radio"]');
        if (radio && radio.value === method) {
          card.classList.add('selected');
          radio.checked = true;
        } else {
          card.classList.remove('selected');
          if (radio) radio.checked = false;
        }
      });
    }

    function showError(msg) {
      const el = document.getElementById("checkout-error");
      const text = document.getElementById("error-message");
      if (el && text) {
        text.innerText = msg;
        el.classList.remove("hidden");
      }
    }

    async function submitPayment() {
      const email = document.getElementById("cust-email").value.trim();
      const name = document.getElementById("cust-name").value.trim();

      if (!email) {
        showError("Veuillez saisir votre adresse email pour recevoir le reçu.");
        return;
      }

      const btn = document.getElementById("btn-pay");
      btn.disabled = true;
      btn.innerHTML = `<div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Redirection en cours...`;

      try {
        const res = await fetch(`/api/v1/payments/checkout/${sessionId}/pay`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            provider: selectedProvider,
            customer: { email, name },
          }),
        });

        const result = await res.json();

        if (result.success && result.redirectUrl) {
          window.location.href = result.redirectUrl;
        } else {
          showError(result.error || "Échec de l'initialisation du paiement.");
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="lock" class="w-4 h-4"></i> Procéder au paiement`;
          lucide.createIcons({ root: btn });
        }
      } catch (err) {
        showError("Erreur de connexion lors du paiement.");
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="lock" class="w-4 h-4"></i> Procéder au paiement`;
        lucide.createIcons({ root: btn });
      }
    }
  </script>
</body>
</html>
