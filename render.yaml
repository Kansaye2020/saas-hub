services:
  - type: web
    name: saas-payment-hub
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/database.sqlite
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: HUB_BASE_URL
        value: https://saas-payment-hub.onrender.com # Change this once deployed or using custom domain
      - key: CLIENT_APPS
        value: '[{"id":"boutique1","name":"Ma Boutique Demo","apiKey":"secret_api_key_123","webhookUrl":""}]'
